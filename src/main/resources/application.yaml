spring:
  application:
    name: nookio-api
    version: 0.1.0-SNAPSHOT
  cloud:
    openfeign:
      client:
        config:
          nominatimClient:
            connectTimeout: 2000
            readTimeout: 3000
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE}_${ENVIRONMENT}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
server:
  port: 8081
  threads:
    virtual:
      enabled: true

clients:
  api-id: ${API_ID}
  analytics:
    url: ${ANALYTICS_SERVICE_URL}${BASE_ENDPOINT}
    transport: ${ANALYTICS_TRANSPORT:feign}
  payments:
    url: ${PAYMENTS_SERVICE_URL}${BASE_ENDPOINT}
    transport: ${PAYMENTS_TRANSPORT:http}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/