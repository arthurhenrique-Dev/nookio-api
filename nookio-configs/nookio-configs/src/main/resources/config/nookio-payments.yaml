spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/nookio_payments_${ENVIRONMENT}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: ${PORT}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - feign.FeignException.FeignServerException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      nookio-api:
        baseConfig: default
        failureRateThreshold: 50
      nookio-analytics-api:
        baseConfig: default
        failureRateThreshold: 50
      analyticsStompService:
        baseConfig: default
        failureRateThreshold: 50
