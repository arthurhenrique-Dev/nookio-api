events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting: 10 requests/sec per IP, with a burst of 20
    limit_req_zone $binary_remote_addr zone=ip_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    # Max body size limit of 50 MB
    client_max_body_size 50M;

    # Client request timeouts limited to 5 seconds
    client_body_timeout 5s;
    client_header_timeout 5s;

    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway_service {
        server nookio-gateway:8080;
    }

    upstream auth_service {
        server nookio-auth:8081;
    }

    server {
        listen 80;
        server_name localhost;

        # Frame origin security headers (SameOrigin for iframe support)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;

        # Timeouts limited to max 5 seconds
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Global Rate Limiting by IP
        limit_req zone=ip_rate_limit burst=20 nodelay;

        # Auth service routes
        location /api/v1/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General Gateway / API routes with WebSocket support
        location / {
            proxy_pass http://gateway_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
