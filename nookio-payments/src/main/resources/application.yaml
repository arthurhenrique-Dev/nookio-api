spring:
  application:
    name: NOOKIO-PAYMENTS-API
  datasource:
    url: jdbc:sqlite:payments.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: ${PORT}

clients:
  api-id: ${API_ID}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
